[project]
name = "docmini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NgohBuilds", email = "DeepStacker07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
docmini = "docmini:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.docmini.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
